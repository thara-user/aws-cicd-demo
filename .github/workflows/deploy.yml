name: Deploy AWS CI/CD Demo

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: aws-cicd-demo-bcc33d56677b9a2cb6bdb0ba40
  AWS_ROLE_ARN: arn:aws:iam::203374879162:role/github-actions-aws-cicd-demo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate application
        run: |
          test -f app/index.html
          test -f app/style.css
          test -f app/script.js
          grep -q "AWS DevOps CI/CD Demo" app/index.html
          echo "Application validation passed."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Save release snapshot
        run: |
          aws s3 sync app/ s3://${{ env.S3_BUCKET }}/_releases/${{ github.sha }}/
          echo "Release snapshot saved: ${{ github.sha }}"

      - name: Deploy application to S3
        run: |
          aws s3 sync app/ s3://${{ env.S3_BUCKET }} --delete --exclude "_releases/*"

      - name: Verify S3 deployment
        run: |
          aws s3 ls s3://${{ env.S3_BUCKET }}

      - name: Health check
        run: |
          curl --fail --retry 5 --retry-delay 3 \
            http://${{ env.S3_BUCKET }}.s3-website.${{ env.AWS_REGION }}.amazonaws.com/
          echo "Website health check passed."
