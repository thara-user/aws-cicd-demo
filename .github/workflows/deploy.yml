name: Deploy AWS CI/CD Demo

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::203374879162:role/github-actions-aws-cicd-demo
          aws-region: ap-south-1

      - name: Deploy application to S3
        run: |
          aws s3 sync app/ s3://aws-cicd-demo-bcc33d56677b9a2cb6bdb0ba40 --delete

      - name: Verify deployment
        run: |
          aws s3 ls s3://aws-cicd-demo-bcc33d56677b9a2cb6bdb0ba40
