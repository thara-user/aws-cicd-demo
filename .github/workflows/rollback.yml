name: Rollback AWS CI/CD Demo

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Git commit SHA to rollback to"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: aws-cicd-demo-bcc33d56677b9a2cb6bdb0ba40
  AWS_ROLE_ARN: arn:aws:iam::203374879162:role/github-actions-aws-cicd-demo

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate release snapshot
        run: |
          aws s3 ls s3://${{ env.S3_BUCKET }}/_releases/${{ inputs.release_sha }}/
          aws s3api head-object \
            --bucket ${{ env.S3_BUCKET }} \
            --key _releases/${{ inputs.release_sha }}/index.html
          echo "Release snapshot exists."

      - name: Download selected release
        run: |
          rm -rf release
          mkdir release

          aws s3 cp \
            s3://${{ env.S3_BUCKET }}/_releases/${{ inputs.release_sha }}/ \
            ./release/ \
            --recursive

          test -f release/index.html
          test -f release/script.js
          test -f release/style.css

          echo "Release downloaded successfully."

      - name: Remove current deployment
        run: |
          aws s3 rm s3://${{ env.S3_BUCKET }}/ \
            --recursive \
            --exclude "_releases/*"

          echo "Current deployment removed."

      - name: Restore selected release
        run: |
          aws s3 cp ./release/ \
            s3://${{ env.S3_BUCKET }}/ \
            --recursive

          echo "Release restored successfully."

      - name: Verify rollback
        run: |
          aws s3 ls s3://${{ env.S3_BUCKET }}/

          aws s3api head-object \
            --bucket ${{ env.S3_BUCKET }} \
            --key index.html

          aws s3api head-object \
            --bucket ${{ env.S3_BUCKET }} \
            --key script.js

          aws s3api head-object \
            --bucket ${{ env.S3_BUCKET }} \
            --key style.css

          echo "Rollback files verified."

      - name: Health check
        run: |
          curl --fail --retry 5 --retry-delay 3 \
            http://${{ env.S3_BUCKET }}.s3-website.${{ env.AWS_REGION }}.amazonaws.com/

          echo "Rollback health check passed."

      - name: Rollback completed
        run: |
          echo "Rollback completed successfully."
          echo "Restored release: ${{ inputs.release_sha }}"